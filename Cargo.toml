[package]
name = "v-path"
version = "0.1.0"
edition = "2021"
description = "A terminal-based, mathematical pathfinding engine for guitar"
license = "MIT"

[lib]
name = "v_path"
path = "src/lib.rs"

[[bin]]
name = "v-path"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
